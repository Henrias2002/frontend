<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Popup</title>
    <link rel="stylesheet" href="./style.css">
    <script src="./script.js" defer></script>
</head>
<body>
    


    <h1 class="title">Popup demo</h1>

    
    <button class="open-popup" id="open">Open popup</button>

    <div class="popup-wrapper">

        <div class="popup">
            <h1 class="popup-title">Popup</h1>
            <p class="popup-message">Lorem ipsum dolor sit amet consectetur adipisicing elit. Cum officia architecto fugiat eos, ullam voluptas iusto asperiores quam veniam iure suscipit? At nam aspernatur exercitationem.</p>
            <button class="close-popup" id="close">Close</button>
        </div>
    </div>

    

    
</body>
</html>
