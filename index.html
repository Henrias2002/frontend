<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Popup</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    
    <button class="open-popup">Open popup</button>

    <div class="popup-wrapper">

        <div class="popup">
            <h1 class="popup-title">Popup</h1>
            <p class="popup-message">Lorem ipsum dolor sit amet consectetur adipisicing elit. Cum officia architecto fugiat eos, ullam voluptas iusto asperiores quam veniam iure suscipit? At nam aspernatur exercitationem.</p>
            <button class="close-popup">Close</button>
        </div>
    </div>


    
</body>
</html>
